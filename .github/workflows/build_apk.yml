name: Build KurdTube AI APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Latest stable Flutter (no version pin) ─────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart versions
        run: flutter --version

      # ── 4. Download Noto Naskh Arabic fonts ──────────────────────────────────
      - name: Download Noto Naskh Arabic fonts
        run: |
          mkdir -p assets/fonts
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" \
            -o assets/fonts/NotoNaskhArabic-Regular.ttf
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf" \
            -o assets/fonts/NotoNaskhArabic-Bold.ttf
          du -sh assets/fonts/*.ttf

      # ── 5. Scaffold Android wrapper files ─────────────────────────────────────
      # Flutter 3.27+ creates Kotlin DSL (.kts) Gradle files and requires AGP 8.11+.
      # Strategy:
      #   a) Stash ONLY the files we must preserve (AndroidManifest, lib/, assets/, pubspec)
      #   b) Delete all old Groovy .gradle files so flutter create generates fresh .kts ones
      #   c) Run flutter create → produces correct AGP, gradlew, res/ icons, etc.
      #   d) Restore only AndroidManifest.xml, lib/, assets/, pubspec.yaml
      - name: Generate Flutter Android scaffold (AGP-compatible)
        run: |
          echo "── Stashing files to preserve ──"
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_custom.xml
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          tar -czf /tmp/lib_custom.tar.gz lib/
          tar -czf /tmp/assets_custom.tar.gz assets/

          echo "── Removing old Groovy Gradle files (incompatible with Flutter 3.27+) ──"
          rm -f android/build.gradle android/settings.gradle
          rm -f android/app/build.gradle
          # Also remove .kts if any stale ones exist
          rm -f android/build.gradle.kts android/settings.gradle.kts
          rm -f android/app/build.gradle.kts

          echo "── Running flutter create (generates AGP 8.11+ Kotlin DSL Gradle files) ──"
          flutter create . \
            --project-name kurdtube_ai \
            --org com.example \
            --platforms android \
            --overwrite

          echo "── Restoring custom AndroidManifest, pubspec, lib/, assets/ ──"
          cp /tmp/AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          rm -rf lib/ assets/
          tar -xzf /tmp/lib_custom.tar.gz
          tar -xzf /tmp/assets_custom.tar.gz

          echo "── Scaffold verification ──"
          echo -n "gradlew: "; test -f gradlew && echo "YES" || echo "MISSING"
          echo -n "gradle-wrapper.jar: "; test -f android/gradle/wrapper/gradle-wrapper.jar && echo "YES" || echo "MISSING"
          echo -n "mipmap-mdpi: "; test -d android/app/src/main/res/mipmap-mdpi && echo "YES" || echo "MISSING"
          echo -n "settings.gradle.kts: "; test -f android/settings.gradle.kts && echo "YES" || echo "MISSING"
          echo -n "app/build.gradle.kts: "; test -f android/app/build.gradle.kts && echo "YES" || echo "MISSING"
          echo -n "lib/main.dart: "; test -f lib/main.dart && echo "YES" || echo "MISSING"
          echo -n "assets/fonts: "; ls assets/fonts/ | tr '\n' ' '; echo

      # ── 6. Install Flutter packages ───────────────────────────────────────────
      - name: Install Flutter packages
        run: flutter pub get

      # ── 7. Analyze (non-blocking) ─────────────────────────────────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── 8. Build debug APK ────────────────────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 9. Build release APK ──────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── 10. Upload APKs ───────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Create GitHub Release on v* tag push ─────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" \
            -o assets/fonts/NotoNaskhArabic-Regular.ttf
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf" \
            -o assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Generate Flutter Android scaffold (AGP-compatible)
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_custom.xml
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          tar -czf /tmp/lib_custom.tar.gz lib/
          tar -czf /tmp/assets_custom.tar.gz assets/

          rm -f android/build.gradle android/settings.gradle
          rm -f android/app/build.gradle
          rm -f android/build.gradle.kts android/settings.gradle.kts
          rm -f android/app/build.gradle.kts

          flutter create . \
            --project-name kurdtube_ai \
            --org com.example \
            --platforms android \
            --overwrite

          cp /tmp/AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          rm -rf lib/ assets/
          tar -xzf /tmp/lib_custom.tar.gz
          tar -xzf /tmp/assets_custom.tar.gz

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KurdTube AI ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## KurdTube AI ${{ github.ref_name }}

            ### Installation
            1. Download `app-release.apk` below.
            2. Enable *Install from unknown sources* on your Android device.
            3. Install the APK and open the app.
            4. Tap ⚙️ Settings → paste your Gemini API key (free at [ai.google.dev](https://ai.google.dev)).

            ### How to use
            - Paste any YouTube URL in the input bar, or
            - Share a video from the YouTube app → KurdTube AI appears in the Share Sheet.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
