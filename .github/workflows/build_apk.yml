name: Build KurdTube AI APK

on:
  push:
    branches: [ main, master ]   # triggers on every branch push
    tags:
      - 'v*'                     # triggers on any tag like v1.0.0, v2.3.1, etc.
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:             # allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required for Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter stable channel
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Download font assets (Noto Naskh Arabic)
      #    The fonts must be in assets/fonts/ before pub get.
      - name: Download Noto Naskh Arabic fonts
        run: |
          mkdir -p assets/fonts
          curl -L "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic-Regular.ttf" \
            -o assets/fonts/NotoNaskhArabic-Regular.ttf
          curl -L "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic-Bold.ttf" \
            -o assets/fonts/NotoNaskhArabic-Bold.ttf

      # 5. Install Flutter dependencies
      - name: Install Flutter packages
        run: flutter pub get

      # 6. (Optional) Run analyzer — warnings don't fail the build
      - name: Analyze code
        run: flutter analyze --no-fatal-warnings || true

      # 7. Build the debug APK (no keystore needed)
      - name: Build debug APK
        run: flutter build apk --debug --verbose

      # 8. Build the release APK (signed with debug key for sideloading)
      - name: Build release APK
        run: flutter build apk --release --verbose

      # 9. Upload both APKs as workflow artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Optional: create a GitHub Release when a version tag is pushed
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          curl -L "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic-Regular.ttf" \
            -o assets/fonts/NotoNaskhArabic-Regular.ttf
          curl -L "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic-Bold.ttf" \
            -o assets/fonts/NotoNaskhArabic-Bold.ttf

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: KurdTube AI ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## KurdTube AI ${{ github.ref_name }}

            ### Installation
            1. Download `app-release.apk` below.
            2. Enable *Install from unknown sources* on your Android device.
            3. Install the APK.
            4. Open the app → Settings → paste your Gemini API key.

            ### What's New
            See commit history for changes in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
