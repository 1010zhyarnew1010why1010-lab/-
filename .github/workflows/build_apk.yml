name: Build KurdTube AI APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Latest stable Flutter ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart versions
        run: flutter --version

      # ── 4. Download Noto Naskh Arabic fonts ──────────────────────────────────
      - name: Download Noto Naskh Arabic fonts
        run: |
          mkdir -p assets/fonts
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf" \
            -o assets/fonts/NotoNaskhArabic-Regular.ttf
          curl -fL \
            "https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf" \
            -o assets/fonts/NotoNaskhArabic-Bold.ttf
          du -sh assets/fonts/*.ttf

      # ── 5. Scaffold Android wrapper files ─────────────────────────────────────
      - name: Generate Flutter Android scaffold
        run: |
          echo "── Stashing files to preserve ──"
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest_custom.xml
          cp pubspec.yaml /tmp/pubspec_custom.yaml
          tar -czf /tmp/lib_custom.tar.gz lib/
          tar -czf /tmp/assets_custom.tar.gz assets/

          echo "── Removing old Gradle files ──"
          rm -f android/build.gradle android/settings.gradle
          rm -f android/app/build.gradle
          rm -f android/build.gradle.kts android/settings.gradle.kts
          rm -f android/app/build.gradle.kts

          echo "── Running flutter create ──"
          flutter create . \
            --project-name kurdtube_ai \
            --org com.example \
            --platforms android \
            --overwrite

          echo "── Restoring custom AndroidManifest, pubspec, lib/, assets/ ──"
          cp /tmp/AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/pubspec_custom.yaml pubspec.yaml
          rm -rf lib/ assets/
          tar -xzf /tmp/lib_custom.tar.gz
          tar -xzf /tmp/assets_custom.tar.gz

      # ── 6. Install Flutter packages ───────────────────────────────────────────
      - name: Install Flutter packages
        run: flutter pub get

      # ── 7. Patch plugins for AGP 8+ and ProGuard compatibility ────────────────
      - name: Patch plugins for AGP 8+ and ProGuard compatibility
        run: |
          echo "── 1. Replacing proguard-android.txt with proguard-android-optimize.txt across all gradle files ──"
          find ~/.pub-cache android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} + || true

          echo "── 2. Configuring gradle.properties ──"
          mkdir -p android
          touch android/gradle.properties
          grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          grep -q "android.suppressUnsupportedCompileSdk" android/gradle.properties || echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

          echo "── 3. Injecting namespaces for plugins missing namespace ──"
          python3 - << 'EOF'
          import os, re

          pub_cache = os.path.expanduser("~/.pub-cache")
          search_dirs = [pub_cache, "android"]
          patched_count = 0

          for base_dir in search_dirs:
              if not os.path.exists(base_dir):
                  continue
              for root, dirs, files in os.walk(base_dir):
                  for file in files:
                      if file == "build.gradle":
                          bg_path = os.path.join(root, file)
                          try:
                              with open(bg_path, "r", encoding="utf-8", errors="ignore") as f:
                                  content = f.read()

                              new_content = content.replace("proguard-android.txt", "proguard-android-optimize.txt")

                              if "android {" in new_content and "namespace" not in new_content:
                                  manifest_path = os.path.join(root, "src", "main", "AndroidManifest.xml")
                                  pkg = None
                                  if os.path.exists(manifest_path):
                                      with open(manifest_path, "r", encoding="utf-8", errors="ignore") as mf:
                                          m = re.search(r'package\s*=\s*["\']([^"\']+)["\']', mf.read())
                                          if m:
                                              pkg = m.group(1)
                                  if not pkg:
                                      if "flutter_inappwebview" in root:
                                          pkg = "com.pichillilorenzo.flutter_inappwebview_android"
                                      else:
                                          parent_name = os.path.basename(os.path.dirname(root) if os.path.basename(root) == "android" else root)
                                          clean_name = re.sub(r'[^a-zA-Z0-9_]', '_', parent_name)
                                          pkg = f"com.flutter_plugin.{clean_name}"

                                  new_content = new_content.replace("android {", f"android {{\n    namespace '{pkg}'", 1)
                                  print(f"Injected namespace '{pkg}' into {bg_path}")
                                  patched_count += 1

                              if new_content != content:
                                  with open(bg_path, "w", encoding="utf-8") as f:
                                      f.write(new_content)
                          except Exception as e:
                              print(f"Warning patching {bg_path}: {e}")

          print(f"Total plugins patched with namespace: {patched_count}")
          EOF

          echo "── 4. Disabling minify/shrink and ensuring minSdk >= 21, compileSdk = 37 in app build.gradle ──"
          python3 - << 'EOF'
          import os, re
          app_gradle_kts = "android/app/build.gradle.kts"
          app_gradle = "android/app/build.gradle"

          if os.path.exists(app_gradle_kts):
              with open(app_gradle_kts, "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', c)
              c = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', c)
              c = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', c)
              c = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 37', c)
              with open(app_gradle_kts, "w", encoding="utf-8") as f:
                  f.write(c)
              print("Patched app/build.gradle.kts (minSdk=21, compileSdk=37, minify disabled)")

          if os.path.exists(app_gradle):
              with open(app_gradle, "r", encoding="utf-8") as f:
                  c = f.read()
              c = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', c)
              c = re.sub(r'shrinkResources\s+true', 'shrinkResources false', c)
              c = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', c)
              c = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 37', c)
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(c)
              print("Patched app/build.gradle (minSdk=21, compileSdk=37, minify disabled)")
          EOF

      # ── 8. Analyze (non-blocking) ─────────────────────────────────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── 9. Build debug APK ────────────────────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 10. Build release APK ─────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      # ── 11. Upload APKs ───────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KurdTubeAI-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Create GitHub Release on v* tag push ─────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: KurdTubeAI-release-apk
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KurdTube AI ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-apk/app-release.apk
          body: |
            ## KurdTube AI ${{ github.ref_name }}

            ### Installation
            1. Download `app-release.apk` below.
            2. Enable *Install from unknown sources* on your Android device.
            3. Install the APK and open the app.
            4. Tap ⚙️ Settings → paste your Gemini API key (free at [ai.google.dev](https://ai.google.dev)).

            ### How to use
            - Paste any YouTube URL in the input bar, or
            - Share a video from the YouTube app → KurdTube AI appears in the Share Sheet.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
