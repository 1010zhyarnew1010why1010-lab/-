name: kurdtube_ai
description: Zhirnoos (ژێرنووس) - YouTube transcript translator to Kurdish (Sorani & Kurmanji) using Gemini AI.
publish_to: 'none'
version: 2.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # YouTube player & data extraction
  # 9.0.4 is compatible with wide Dart SDK range
  youtube_player_flutter: ^9.0.4

  # Share intent from native apps
  receive_sharing_intent: ^1.8.0

  # Networking & AI
  http: ^1.2.2
  google_generative_ai: ^0.4.3

  # Local storage & files
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.2

  # UI helpers
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
